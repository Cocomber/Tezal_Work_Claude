      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              neo: {
                bg: '#f0f0f0',
                main: '#1a1a1a',
                accent1: '#FF6B6B', // Red/Pink
                accent2: '#4ECDC4', // Teal
                accent3: '#FFE66D', // Yellow

            boxShadow: {
              'neo': '4px 4px 0px 0px rgba(0,0,0,1)',
              'neo-sm': '2px 2px 0px 0px rgba(0,0,0,1)',

            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
            }
          }
        }
      }

    <style>
      html {

      body {
